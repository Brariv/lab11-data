# ============================================================
# Laboratorio 11 - MLOps - Observatorio de Inteligencia Turistica
# Archivo de configuracion del pipeline
# Todo parametro, ruta, periodo y umbral vive aqui; el codigo no
# contiene valores "magicos". Cambiar este archivo cambia la corrida.
# ============================================================

proyecto:
  nombre: "Observatorio de Inteligencia Turistica"
  destino: "flujo_mensual_nacional"      # destino/serie asignada a este grupo
  version_procedimiento: "0.1.0-avance"  # version del procedimiento de estimacion
  semilla: 42                            # semilla para componentes aleatorios

# ---- Fuentes de datos ----
# Los datos institucionales NO se versionan ni se incluyen en la imagen Docker.
# Se montan por ruta configurable. Si la ruta real no existe, el pipeline usa
# la muestra sintetica para poder ejecutarse de punta a punta.
fuentes:
  migracion_mensual:
    ruta: "data/institucional/migracion_mensual.csv"
    ruta_respaldo_muestra: "data/sample/migracion_mensual_sample.csv"
    descripcion: "Base de Migracion 2009-2026 (INGUAT / IGM), fuente MENSUAL"
    # Columnas minimas indispensables y su tipo esperado
    columnas_requeridas:
      periodo: "date"        # primer dia del mes (YYYY-MM-01)
      destino: "string"      # serie/segmento
      viajeros: "int"        # conteo de movimientos de viajeros (numerador)
      dias_fuente: "int"     # dias reportados en el mes (denominador de cobertura)
      origen_fuente: "string"  # "mensual" | "diaria_agregada" (regla metodologica)
    clave_unicidad: ["periodo", "destino"]   # granularidad: un registro por mes y destino

# ---- Variable que se estima ----
variable:
  nombre: "movimientos_mensuales_de_viajeros"
  unidad: "personas (conteo de movimientos)"
  nivel_agregacion: "mensual, nacional"
  no_negativa: true
  entera: true

# ---- Periodos (respetan el orden temporal) ----
periodos:
  inicio_serie: "2009-01-01"
  fin_serie: "2025-12-01"
  ajuste_inicio: "2009-01-01"      # entrenamiento
  ajuste_fin: "2021-03-01"
  evaluacion_inicio: "2021-04-01"  # backtesting / validacion temporal
  evaluacion_fin: "2025-12-01"
  # Meses ocultados para la validacion temporal del avance (se estiman como si
  # no estuvieran disponibles). No se usan enero/febrero 2026 por falta de
  # observaciones comparables (clasificacion de la base cambio en 2023).
  meses_ocultos: ["2025-11-01", "2025-12-01"]

# ---- Parametros y supuestos del procedimiento de estimacion ----
procedimiento:
  metodo: "baseline_estacional"    # procedimiento reproducible del avance
  ventana_nivel_meses: 12          # meses recientes para estimar el nivel
  # Factor de reparto: supuesto para distribuir conteos sin mes asignado dentro
  # de un periodo. Se reparte segun el perfil estacional del destino.
  # Documentado como supuesto; configurable y auditable.
  factor_reparto:
    activo: true
    metodo: "perfil_estacional"    # "perfil_estacional" | "uniforme"
    descripcion: >
      Los registros agregados sin mes se distribuyen entre los meses del periodo
      proporcionalmente al indice estacional del destino. Nunca se reparte sobre
      periodos sin cobertura (esos quedan como faltantes, no como cero).
  referencias:                     # procedimientos de referencia a comparar
    - "ultimo_valor_observado"
    - "promedio_historico"

# ---- Umbrales de aceptacion de una version candidata ----
aceptacion:
  # Escala de la variable: decenas/cientos de miles de personas por mes.
  mae_maximo: 120000             # MAE maximo tolerado (personas/mes)
  rmse_maximo: 160000
  debe_igualar_o_superar_referencia: false   # no es obligatorio superar la referencia
  requiere_controles_criticos_ok: true       # ningun control critico puede fallar
  requiere_salidas_completas: true           # sin huecos no justificados en la salida

# ---- Controles de calidad: que es advertencia y que detiene ----
controles:
  cobertura:
    dias_minimos_mes: 20          # < => advertencia de cobertura parcial
  faltantes:
    columnas_permiten_na: ["dias_fuente"]  # NA tolerado aqui
    columnas_bloquean_na: ["periodo", "destino", "viajeros"]
  variacion:
    umbral_variacion_relativa: 0.80  # cambio mes a mes > 80% => alerta (no error)

# ---- Salida que consume el tablero ----
salida:
  carpeta_aprobada: "results/approved"
  carpeta_candidata: "results/candidate"
  archivo_estimaciones: "estimaciones.csv"
  archivo_metadatos: "run_metadata.json"
  reporte_calidad: "reporte_calidad.json"
